name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y libfuse3-dev pkg-config
      - run: python -m pip install '.[dev,fuse]'
      - run: make check
      - run: python -m build

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          load: false
          push: false

  benchmark-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: make benchmark
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-amd64
          path: build/performance/amd64.json
          if-no-files-found: error
