[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-acornfs"
version = "0.1.0"
description = "A safe userspace filesystem for Acorn disk images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "oaknut-adfs==12.13.1",
    "oaknut-afs==12.13.1",
    "oaknut-basic==12.13.1",
    "oaknut-cli==12.13.1",
    "oaknut-codecs==12.13.1",
    "oaknut-disc==12.13.1",
    "oaknut-discimage==12.13.1",
    "oaknut-dfs==12.13.1",
    "oaknut-exception==12.13.1",
    "oaknut-extension==12.13.1",
    "oaknut-file==12.13.1",
    "oaknut-filesystem==12.13.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
fuse = [
    "pyfuse3>=3.5,<4",
    "trio>=0.22,<1",
]
fuzz = [
    "atheris>=3,<4; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
release = [
    "build==1.5.0",
    "cyclonedx-bom==7.3.1",
    "setuptools==83.0.0",
    "wheel==0.47.0",
]

[project.scripts]
acornfs = "acornfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acornfs = ["locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["acornfs"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*", "oaknut.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "acornfs_nautilus.extension"
disable_error_code = ["misc"]
